services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devvault-backend
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: devvault
      DB_USER: devvault_user
      DB_PASSWORD: devvault_password
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://your-backend-domain.com/api
    container_name: devvault-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: devvault-mysql
    environment:
      MYSQL_DATABASE: devvault
      MYSQL_USER: devvault_user
      MYSQL_PASSWORD: devvault_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./devvault_backup.sql:/docker-entrypoint-initdb.d/devvault_backup.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data: